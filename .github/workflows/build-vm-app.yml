name: Build OT Sense VM app
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack
        run: Expand-Archive -Path OTSense-VM-source.zip -DestinationPath pack
      - name: Self-test
        run: python pack/windows-vm-launcher/otsense_vm.py --selftest
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --noconsole --uac-admin --name OTSense-VM pack/windows-vm-launcher/otsense_vm.py
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vm-${{ github.run_number }}
          files: dist/OTSense-VM.exe
