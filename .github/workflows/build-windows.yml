name: Build Windows sensor (OTSense-Sensor.exe)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['otsense.py', '.github/workflows/build-windows.yml']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller scapy

      - name: Build the exe
        run: >
          pyinstaller --onefile --console --noconfirm --name OTSense-Sensor
          --collect-submodules scapy --collect-data scapy
          otsense.py

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = ".\dist\OTSense-Sensor.exe"
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }
          & $exe sample sample.pcap
          if ($LASTEXITCODE -ne 0) { throw "sample failed" }
          & $exe pcap sample.pcap -o out -q
          if ($LASTEXITCODE -ne 0) { throw "pcap analysis failed" }
          if (-not (Test-Path out\otsense.json)) { throw "no report written" }
          (Get-FileHash $exe -Algorithm SHA256).Hash | Tee-Object dist\OTSense-Sensor.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OTSense-Sensor-exe
          path: |
            dist/OTSense-Sensor.exe
            dist/OTSense-Sensor.exe.sha256
          if-no-files-found: error
